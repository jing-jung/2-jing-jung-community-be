[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "2-jing-jung-community-be"
version = "2.0.0"
description = "Production-ready Community Platform with advanced architecture"
requires-python = ">=3.11"
dependencies = [
  # Core Framework
  "fastapi>=0.115",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-multipart",
  "python-dotenv",
  
  # Database
  "sqlalchemy>=2.0",
  "pymysql",
  "aiomysql",  # Async MySQL support
  
  # Caching & Queue
  "redis>=5.0",
  "hiredis",  # Redis performance boost
  
  # Security
  "bcrypt",
  "passlib[bcrypt]",
  "python-jose[cryptography]",  # JWT
  
  # Monitoring & Logging
  "prometheus-client",
  "loguru",
  
  # AI/ML (기존)
  "pandas",
  "langchain-groq",
  "langchain",
  "langchain-core",
  
  # AWS (Optional)
  "boto3",  # S3 upload
]