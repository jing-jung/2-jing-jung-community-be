# =============================================================================
# Ultra-Scale Architecture for 1M+ Concurrent Users
# 100만명 이상 동시접속 대응 아키텍처
# =============================================================================

# 1. Redis Cluster ConfigMap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-config
  namespace: default
data:
  redis.conf: |
    cluster-enabled yes
    cluster-config-file nodes.conf
    cluster-node-timeout 5000
    appendonly yes
    maxmemory 2gb
    maxmemory-policy allkeys-lru

# 2. Redis Cluster StatefulSet
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: default
spec:
  serviceName: redis-cluster-svc
  replicas: 6
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: client
        - containerPort: 16379
          name: gossip
        command:
        - redis-server
        - /conf/redis.conf
        volumeMounts:
        - name: conf
          mountPath: /conf
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
      volumes:
      - name: conf
        configMap:
          name: redis-cluster-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

# 3. Redis Cluster Service
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-svc
  namespace: default
spec:
  clusterIP: None
  selector:
    app: redis-cluster
  ports:
  - name: client
    port: 6379
  - name: gossip
    port: 16379

# 4. Backend Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ultra
  namespace: default
spec:
  replicas: 20
  selector:
    matchLabels:
      app: backend-ultra
  template:
    metadata:
      labels:
        app: backend-ultra
    spec:
      containers:
      - name: backend
        image: 016562553479.dkr.ecr.ap-southeast-2.amazonaws.com/community-be:latest
        ports:
        - containerPort: 5000
        env:
        - name: DB_POOL_SIZE
          value: "50"
        - name: DB_MAX_OVERFLOW
          value: "100"
        - name: REDIS_HOST
          value: redis-cluster-svc
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5

# 5. Backend Service
---
apiVersion: v1
kind: Service
metadata:
  name: backend-ultra-svc
  namespace: default
spec:
  selector:
    app: backend-ultra
  ports:
  - port: 80
    targetPort: 5000
  type: ClusterIP

# 6. HPA
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-ultra-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-ultra
  minReplicas: 20
  maxReplicas: 100
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
